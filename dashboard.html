<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leads — Sílvio Filho Advocacia</title>
<style>
:root{
  --bg:#0A0A0A;
  --card:#171717;
  --linha:#262626;
  --linha-2:#333;
  --txt:#EDEDED;
  --txt-2:#A1A1A1;
  --txt-3:#6B6B6B;
  --azul:#4C7DF0;
  --verde:#25B160;
  --amarelo:#D9A441;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

/* ---------------- login ---------------- */
.login{min-height:100dvh;display:grid;place-items:center;padding:1.5rem}
.login__card{
  width:100%;max-width:340px;background:var(--card);
  border:1px solid var(--linha);border-radius:12px;padding:1.8rem 1.6rem;
}
.login__card h1{font-size:15px;font-weight:600;letter-spacing:.06em;margin:0 0 .3rem}
.login__card p{margin:0 0 1.5rem;color:var(--txt-3);font-size:12.5px}
.campo{margin-bottom:.9rem}
.campo label{display:block;font-size:11px;letter-spacing:.08em;color:var(--txt-3);margin-bottom:.4rem}
.campo input{
  width:100%;font:inherit;background:#0F0F0F;color:var(--txt);
  border:1px solid var(--linha-2);border-radius:8px;padding:.6rem .7rem;
}
.campo input:focus{outline:none;border-color:#4C7DF0}
.btn{
  width:100%;background:var(--txt);color:#0A0A0A;border:0;border-radius:8px;
  padding:.65rem;font-weight:600;font-size:13px;margin-top:.4rem;
  transition:opacity .2s;
}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.5;cursor:default}
.erro{color:#E5645B;font-size:12px;margin-top:.8rem;min-height:1em}

/* ---------------- app ---------------- */
.app{display:none;max-width:1180px;margin:0 auto;padding:1.6rem 1.2rem 4rem}
.topo{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.6rem}
.topo h1{font-size:14px;font-weight:600;letter-spacing:.1em;margin:0}
.topo p{margin:.25rem 0 0;color:var(--txt-3);font-size:12.5px}
.sair{
  background:transparent;border:1px solid var(--linha-2);border-radius:7px;
  color:var(--txt-2);font-size:11px;letter-spacing:.09em;padding:.45rem .8rem;
}
.sair:hover{border-color:#555;color:var(--txt)}

.card{
  background:var(--card);border:1px solid var(--linha);
  border-radius:12px;padding:1.2rem 1.2rem 1.3rem;margin-bottom:1rem;
}
.card__topo{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
.card__topo h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.02em}
.periodo{display:flex;align-items:center;gap:.5rem;font-size:11px;color:var(--txt-3)}
.periodo input{
  font:inherit;font-size:12px;background:#0F0F0F;color:var(--txt-2);
  border:1px solid var(--linha-2);border-radius:6px;padding:.3rem .45rem;
  color-scheme:dark;
}

/* gráfico */
.gfx{width:100%;height:230px;display:block}
.gfx .grade{stroke:#242424;stroke-width:1}
.gfx .eixo{fill:var(--txt-3);font-size:10px}
.gfx .serie{fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.gfx .pt{r:2.5;stroke:var(--card);stroke-width:1.5}
.legenda{display:flex;gap:1.4rem;flex-wrap:wrap;margin-top:.9rem;font-size:11.5px;color:var(--txt-2)}
.legenda i{display:inline-block;width:9px;height:2px;margin-right:.45rem;vertical-align:middle;border-radius:1px}

/* tabelas */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:10.5px;letter-spacing:.09em;color:var(--txt-3);
  font-weight:500;padding:.5rem .6rem;border-bottom:1px solid var(--linha-2);white-space:nowrap;
}
td{padding:.65rem .6rem;border-bottom:1px solid #1F1F1F;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tabela-rolagem{overflow-x:auto;margin:0 -.3rem}
.vazio{color:var(--txt-3);font-size:12.5px;padding:1.4rem .6rem;text-align:center}
.zap{
  display:inline-flex;align-items:center;gap:.35rem;text-decoration:none;
  border:1px solid var(--linha-2);border-radius:6px;padding:.3rem .55rem;
  font-size:11.5px;color:var(--txt-2);white-space:nowrap;
}
.zap:hover{border-color:var(--verde);color:var(--verde)}
.zap svg{width:13px;height:13px;fill:currentColor}
.tag{color:var(--txt-3);font-size:12px}
.carregando{color:var(--txt-3);font-size:12.5px;padding:1.2rem .6rem}

@media(max-width:560px){
  .topo{flex-direction:column}
  .card{padding:1rem .9rem 1.1rem}
}
</style>
</head>
<body>

<!-- ============================ LOGIN ============================ -->
<div class="login" id="login">
  <form class="login__card" id="form-login">
    <h1>LEADS — SÍLVIO FILHO ADVOCACIA</h1>
    <p>Acesso restrito ao escritório.</p>
    <div class="campo">
      <label for="usuario">USUÁRIO</label>
      <input type="text" id="usuario" value="Admin" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="senha">SENHA</label>
      <input type="password" id="senha" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="btn-entrar">Entrar</button>
    <p class="erro" id="erro-login"></p>
  </form>
</div>

<!-- ============================= APP ============================= -->
<div class="app" id="app">
  <header class="topo">
    <div>
      <h1>LEADS — SÍLVIO FILHO ADVOCACIA</h1>
      <p id="resumo">—</p>
    </div>
    <button class="sair" id="sair">SAIR</button>
  </header>

  <section class="card">
    <div class="card__topo">
      <h2>Evolução diária</h2>
      <div class="periodo">
        <span>DE</span><input type="date" id="de">
        <span>ATÉ</span><input type="date" id="ate">
      </div>
    </div>
    <div id="area-grafico"><p class="carregando">Carregando…</p></div>
    <div class="legenda">
      <span><i style="background:#4C7DF0"></i>Visitas</span>
      <span><i style="background:#25B160"></i>Cadastros</span>
      <span><i style="background:#D9A441"></i>Taxa de conversão %</span>
    </div>
  </section>

  <section class="card">
    <div class="card__topo"><h2>Conversão por LP</h2></div>
    <div class="tabela-rolagem">
      <table>
        <thead><tr><th>LP</th><th class="num">Visitas</th><th class="num">Leads</th><th class="num">Conv.</th></tr></thead>
        <tbody id="tb-lps"><tr><td colspan="4" class="carregando">Carregando…</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <div class="card__topo"><h2>Leads</h2></div>
    <div class="tabela-rolagem">
      <table>
        <thead><tr><th>Nome</th><th>WhatsApp</th><th>LP</th><th>Origem</th><th>Data</th><th>Ação</th></tr></thead>
        <tbody id="tb-leads"><tr><td colspan="6" class="carregando">Carregando…</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
/* ===========================================================================
   CONFIGURAÇÃO
   =========================================================================== */
const SB = {
  url:  "https://qxhnjzyhtllmtdrcyygi.supabase.co",
  key:  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4aG5qenlodGxsbXRkcmN5eWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMzczNjgsImV4cCI6MjA5NzgxMzM2OH0.DWf4I_x9F--H7ZZHUt_n4V3B__Nlsf1jNZdUV0vNBLU",
  site: "silvio-filho"
};
/* usuário exibido -> e-mail real no Supabase Auth */
const USUARIOS = { "admin": "admin@silvio-filho.adsbr.internal" };
const CLIENTE = "Sílvio Filho Advocacia";

const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("sf_token") || null;
let dados = { visitas: [], leads: [] };

/* ===========================================================================
   AUTENTICAÇÃO
   =========================================================================== */
$("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("btn-entrar"), erro = $("erro-login");
  const email = USUARIOS[$("usuario").value.trim().toLowerCase()];
  erro.textContent = "";
  if (!email){ erro.textContent = "Usuário não encontrado."; return; }

  btn.disabled = true; btn.textContent = "Entrando…";
  try{
    const r = await fetch(SB.url + "/auth/v1/token?grant_type=password", {
      method:"POST",
      headers:{ "apikey": SB.key, "Content-Type":"application/json" },
      body: JSON.stringify({ email, password: $("senha").value })
    });
    const j = await r.json();
    if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || "Senha incorreta.");
    token = j.access_token;
    sessionStorage.setItem("sf_token", token);
    abrirPainel();
  }catch(err){
    erro.textContent = err.message === "Failed to fetch"
      ? "Sem conexão com o servidor."
      : "Não foi possível entrar. Confira usuário e senha.";
  }finally{
    btn.disabled = false; btn.textContent = "Entrar";
  }
});

$("sair").addEventListener("click", () => {
  sessionStorage.removeItem("sf_token");
  token = null;
  $("app").style.display = "none";
  $("login").style.display = "grid";
  $("senha").value = "";
});

function abrirPainel(){
  $("login").style.display = "none";
  $("app").style.display = "block";
  const hoje = new Date();
  const inicio = new Date(hoje); inicio.setDate(inicio.getDate() - 29);
  $("de").value  = iso(inicio);
  $("ate").value = iso(hoje);
  carregar();
}

/* ===========================================================================
   DADOS
   =========================================================================== */
async function api(caminho){
  const r = await fetch(SB.url + "/rest/v1/" + caminho, {
    headers:{ "apikey": SB.key, "Authorization": "Bearer " + token }
  });
  if (r.status === 401 || r.status === 403){ $("sair").click(); throw new Error("sessao"); }
  if (!r.ok) throw new Error("Falha ao consultar " + caminho);
  return r.json();
}

async function carregar(){
  try{
    const [visitas, leads] = await Promise.all([
      api("lp_visits?select=site,path,created_at&order=created_at.asc&limit=20000"),
      api("lp_leads?select=site,nome,whatsapp,origem,created_at&order=created_at.desc&limit=5000")
    ]);
    dados = { visitas, leads };
    render();
  }catch(err){
    if (err.message === "sessao") return;
    $("area-grafico").innerHTML = '<p class="vazio">Não foi possível carregar os dados.</p>';
  }
}

["de","ate"].forEach(id => $(id).addEventListener("change", render));

/* ===========================================================================
   RENDER
   =========================================================================== */
function render(){
  const de  = $("de").value  ? new Date($("de").value  + "T00:00:00") : null;
  const ate = $("ate").value ? new Date($("ate").value + "T23:59:59") : null;
  const dentro = (r) => {
    const d = new Date(r.created_at);
    return (!de || d >= de) && (!ate || d <= ate);
  };
  const visitas = dados.visitas.filter(dentro);
  const leads   = dados.leads.filter(dentro);

  $("resumo").textContent = leads.length === 1
    ? "1 lead no período"
    : leads.length + " leads no período";

  grafico(visitas, leads, de, ate);
  tabelaLps(visitas, leads);
  tabelaLeads(leads);
}

/* ---------- gráfico ---------- */
function grafico(visitas, leads, de, ate){
  const alvo = $("area-grafico");
  if (!visitas.length && !leads.length){
    alvo.innerHTML = '<p class="vazio">Nenhum dado encontrado</p>';
    return;
  }
  const inicio = de  || new Date(Math.min(...[...visitas, ...leads].map(r => +new Date(r.created_at))));
  const fim    = ate || new Date();
  const dias = [];
  for (let d = new Date(iso(inicio) + "T00:00:00"); d <= fim; d.setDate(d.getDate() + 1)){
    dias.push(iso(d));
  }
  if (dias.length > 120) dias.splice(0, dias.length - 120);

  const cont = (arr) => arr.reduce((m, r) => (m[iso(new Date(r.created_at))] = (m[iso(new Date(r.created_at))] || 0) + 1, m), {});
  const cv = cont(visitas), cl = cont(leads);
  const sv = dias.map(d => cv[d] || 0);
  const sl = dias.map(d => cl[d] || 0);
  const sc = dias.map((d,i) => sv[i] ? (sl[i] / sv[i]) * 100 : 0);

  const W = 900, H = 230, ml = 34, mr = 34, mt = 14, mb = 26;
  const larg = W - ml - mr, alt = H - mt - mb;
  const maxE = Math.max(4, ...sv, ...sl);
  const x = (i) => ml + (dias.length === 1 ? larg/2 : (i / (dias.length - 1)) * larg);
  const yE = (v) => mt + alt - (v / maxE) * alt;
  const yD = (v) => mt + alt - (Math.min(v, 100) / 100) * alt;

  const linha = (serie, fn) => serie.map((v,i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + fn(v).toFixed(1)).join(" ");
  const pontos = (serie, fn, cor) => dias.length > 45 ? "" : serie.map((v,i) =>
    `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${fn(v).toFixed(1)}" fill="${cor}"><title>${fmtDia(dias[i])} — ${cor === "#D9A441" ? v.toFixed(1) + "%" : v}</title></circle>`).join("");

  const grades = [0, .25, .5, .75, 1].map(p => {
    const y = mt + alt - p * alt;
    return `<line class="grade" x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}"/>
            <text class="eixo" x="${ml-7}" y="${y+3}" text-anchor="end">${Math.round(maxE*p)}</text>
            <text class="eixo" x="${W-mr+7}" y="${y+3}">${Math.round(100*p)}%</text>`;
  }).join("");

  const passo = Math.ceil(dias.length / 8);
  const rotulos = dias.map((d,i) => (i % passo === 0 || i === dias.length-1)
    ? `<text class="eixo" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${fmtDia(d)}</text>` : "").join("");

  alvo.innerHTML = `<svg class="gfx" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolução diária de visitas, cadastros e conversão">
    ${grades}${rotulos}
    <path class="serie" stroke="#4C7DF0" d="${linha(sv, yE)}"/>
    <path class="serie" stroke="#25B160" d="${linha(sl, yE)}"/>
    <path class="serie" stroke="#D9A441" stroke-dasharray="4 3" d="${linha(sc, yD)}"/>
    ${pontos(sv, yE, "#4C7DF0")}${pontos(sl, yE, "#25B160")}${pontos(sc, yD, "#D9A441")}
  </svg>`;
}

/* ---------- conversão por LP ---------- */
function tabelaLps(visitas, leads){
  const tb = $("tb-lps");
  const mapa = {};
  visitas.forEach(v => (mapa[v.site] = mapa[v.site] || {v:0,l:0}).v++);
  leads.forEach(l => (mapa[l.site] = mapa[l.site] || {v:0,l:0}).l++);
  const linhas = Object.entries(mapa).sort((a,b) => b[1].v - a[1].v);

  if (!linhas.length){ tb.innerHTML = '<tr><td colspan="4" class="vazio">Nenhum dado encontrado</td></tr>'; return; }
  tb.innerHTML = linhas.map(([site,d]) => `<tr>
      <td>${esc(site)}</td>
      <td class="num">${d.v}</td>
      <td class="num">${d.l}</td>
      <td class="num">${d.v ? ((d.l/d.v)*100).toFixed(1) + "%" : "—"}</td>
    </tr>`).join("");
}

/* ---------- leads ---------- */
function tabelaLeads(leads){
  const tb = $("tb-leads");
  if (!leads.length){ tb.innerHTML = '<tr><td colspan="6" class="vazio">Nenhum lead encontrado</td></tr>'; return; }
  tb.innerHTML = leads.map(l => {
    const num = String(l.whatsapp || "").replace(/\D/g,"");
    const tel = num.length <= 11 ? "55" + num : num;
    const msg = encodeURIComponent(`Olá, ${l.nome}. Recebemos seu contato através da ${CLIENTE} e gostaria de dar continuidade ao seu atendimento.`);
    return `<tr>
      <td>${esc(l.nome)}</td>
      <td>${esc(l.whatsapp)}</td>
      <td class="tag">${esc(l.site)}</td>
      <td class="tag">${esc(l.origem || "—")}</td>
      <td class="tag">${fmtData(l.created_at)}</td>
      <td>${num.length >= 10 ? `<a class="zap" href="https://wa.me/${tel}?text=${msg}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.4c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm5.5 12.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.6.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.6-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.2-.6-1.5-.9-2.1-.2-.5-.4-.4-.6-.5h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 5 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z"/></svg>
        Chamar</a>` : '<span class="tag">—</span>'}</td>
    </tr>`;
  }).join("");
}

/* ---------- utilidades ---------- */
function iso(d){ return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function fmtDia(s){ const [,m,d] = s.split("-"); return d + "/" + m; }
function fmtData(s){
  const d = new Date(s);
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"}) + " " +
         d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function esc(v){ return String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* sessão já aberta nesta aba */
if (token) abrirPainel();
</script>
</body>
</html>
