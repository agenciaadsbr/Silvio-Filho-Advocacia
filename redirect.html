<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Abrindo o WhatsApp | Sílvio Filho Advocacia</title>
<meta name="theme-color" content="#0A1628">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<!-- PIXEL DO META / GOOGLE ADS: colar o código base aqui. O evento de conversão
     ("Lead") é disparado no script abaixo, sem nenhum dado pessoal. -->
<style>
:root{--navy:#0A1628;--gold:#C9A46A;--gold-hi:#E6CD9B;--grad:linear-gradient(100deg,#A9864E 0%,#E6CD9B 45%,#C49C5F 70%,#9E7B45 100%)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:#C3C9D3;font-family:Montserrat,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 22px;text-align:center}
main{max-width:520px;width:100%}
img{height:84px;width:auto;margin:0 auto 34px;display:block}
h1{color:#F4EEE3;font-weight:800;text-transform:uppercase;font-size:clamp(24px,6vw,32px);line-height:1.15;margin:0}
.ouro{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.filete{display:block;width:80px;height:2px;background:var(--grad);margin:22px auto}
p{margin:0 0 10px;font-size:17px;line-height:1.6}
.trilho{height:4px;border-radius:4px;background:rgba(201,164,106,.18);overflow:hidden;margin:30px 0 26px}
.trilho i{display:block;height:100%;width:0;background:var(--grad)}
.trilho.on i{width:100%;transition:width 3s linear}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:15px 28px;border-radius:4px;background:var(--grad);color:var(--navy);font:700 15px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;width:100%}
.btn[hidden]{display:none}
small{display:block;margin-top:18px;font-size:13px;color:#8A93A3}
small a{color:var(--gold-hi)}
@media (prefers-reduced-motion:reduce){.trilho.on i{transition:none}}
</style>
</head>
<body>
<main>
  <img src="/img/logo-gold.svg" width="182" height="84" alt="Sílvio Filho Advocacia">
  <h1 id="titulo">Recebemos seu <span class="ouro">contato</span></h1>
  <span class="filete" aria-hidden="true"></span>
  <p id="texto">Em 3 segundos vamos abrir a conversa com a equipe do escritório no WhatsApp.</p>
  <div class="trilho" id="trilho" aria-hidden="true"><i></i></div>
  <a class="btn" id="zap" href="#">Abrir o WhatsApp agora</a>
  <small id="obs">Se o WhatsApp não abrir sozinho, toque no botão acima.</small>
</main>
<script>
/* ===========================================================================
   CONFIG — PREENCHER ANTES DE ATIVAR AS CAMPANHAS
   =========================================================================== */
const CONFIG = {
  /* WhatsApp oficial do escritório, só dígitos, com 55 + DDD (ex.: "5544999999999") */
  whatsapp: "",
  mensagem: "Olá! Vim pelo site e gostaria de orientação sobre {assunto}.",
  espera: 3000
};

const ASSUNTOS = {
  justa: "demissão por justa causa",
  indireta: "rescisão indireta",
  assedio: "assédio moral no trabalho",
  acidente: "acidente de trabalho",
  doenca: "doença relacionada ao trabalho"
};

/* conversão: só chega aqui quem enviou o formulário. Nenhum dado pessoal é enviado. */
try{
  if (window.dataLayer) window.dataLayer.push({event: "lead_redirect"});
  if (typeof fbq === "function") fbq("track", "Lead");
}catch(e){}

let nome = "", chave = "";
try{
  nome = (sessionStorage.getItem("sf_nome") || "").trim();
  chave = sessionStorage.getItem("sf_assunto") || "";
}catch(e){}

if (nome){
  document.getElementById("titulo").innerHTML = "";
  document.getElementById("titulo").append(nome + ", recebemos seu ");
  const s = document.createElement("span"); s.className = "ouro"; s.textContent = "contato";
  document.getElementById("titulo").append(s);
}

const numero = String(CONFIG.whatsapp).replace(/\D/g, "");
const zap = document.getElementById("zap");

if (numero.length >= 12){
  const texto = CONFIG.mensagem.replace("{assunto}", ASSUNTOS[chave] || "atendimento trabalhista");
  const destino = "https://wa.me/" + numero + "?text=" + encodeURIComponent(texto);
  zap.href = destino;
  requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById("trilho").classList.add("on")));
  setTimeout(() => { window.location.href = destino; }, CONFIG.espera);
} else {
  /* número ainda não configurado: não redireciona */
  document.getElementById("texto").textContent = "A equipe do escritório vai falar com você pelo WhatsApp informado.";
  document.getElementById("trilho").hidden = true;
  zap.hidden = true;
  document.getElementById("obs").innerHTML = '<a href="/">Voltar à página inicial</a>';
}
</script>
</body>
</html>
